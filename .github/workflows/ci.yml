name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, Test & Release Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar_insurance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero Local File URIs
        run: |
          if grep -rn "file:///Users/" docs/ README.md packages/ apps/ tests/ scripts/; then
            echo "ERROR: Forbidden absolute local file:///Users/ URLs detected!"
            exit 1
          fi

      - name: Code Formatting Check
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript Monorepo
        run: npm run typecheck

      - name: Build Monorepo Artifacts
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northstar_insurance
        run: npm run db:migrate

      - name: Run Complete Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northstar_insurance
        run: npm run test:coverage

      - name: Run 24-Scenario Evaluation Benchmark
        run: npm run eval

      - name: Run Local Zero-Credential Demonstration
        run: npm run demo

      - name: Run Security Audit
        run: npm run security
