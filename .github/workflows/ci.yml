name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Release Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck TypeScript Monorepo
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Run 24-Scenario Evaluation Benchmark
        run: npm run eval

      - name: Run Security Audit
        run: npm run security

      - name: Run Local Demonstration
        run: npm run demo
