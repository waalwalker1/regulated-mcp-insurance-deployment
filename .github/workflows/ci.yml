name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, Test & Release Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar_insurance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northstar_insurance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero Local File URIs
        run: |
          if grep -rn "file:///Users/" docs/ README.md packages/ apps/ tests/ scripts/; then
            echo "ERROR: Forbidden absolute local file:///Users/ URLs detected!"
            exit 1
          fi

      - name: Verify Markdown Links
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          function getFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const full = path.join(dir, file);
              const stat = fs.statSync(full);
              if (stat && stat.isDirectory()) {
                if (file !== "node_modules" && file !== ".git" && file !== "dist" && file !== "brain") {
                  results = results.concat(getFiles(full));
                }
              } else if (file.endsWith(".md")) {
                results.push(full);
              }
            });
            return results;
          }
          const mdFiles = getFiles(".");
          let broken = 0;
          for (const file of mdFiles) {
            const content = fs.readFileSync(file, "utf8");
            const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let match;
            while ((match = linkRegex.exec(content)) !== null) {
              const rawLink = match[2].trim();
              if (rawLink.startsWith("http://") || rawLink.startsWith("https://") || rawLink.startsWith("#") || rawLink.startsWith("mailto:")) {
                continue;
              }
              const cleanLink = rawLink.split("#")[0];
              if (!cleanLink) continue;
              const resolved = path.resolve(path.dirname(file), cleanLink);
              if (!fs.existsSync(resolved)) {
                console.log(`BROKEN LINK in ${file}: "${rawLink}" -> ${resolved}`);
                broken++;
              }
            }
          }
          if (broken > 0) {
            console.log(`Found ${broken} broken markdown links!`);
            process.exit(1);
          }
          '

      - name: Code Formatting Check
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript Monorepo
        run: npm run typecheck

      - name: Build Monorepo Artifacts
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northstar_insurance
        run: npm run db:migrate

      - name: Run Complete Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northstar_insurance
        run: npm run test:coverage

      - name: Run 24-Scenario Evaluation Benchmark
        run: npm run eval

      - name: Run Local Zero-Credential Demonstration
        run: npm run demo

      - name: Run Security Audit
        run: npm run security

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Start Docker Compose Stack
        env:
          POSTGRES_PORT: 5433
        run: docker compose up -d

      - name: Wait for Docker Services Health
        run: |
          for i in {1..30}; do
            if curl -s --fail http://localhost:3000/health && curl -s --fail http://localhost:3001/health; then
              echo "Docker services healthy and responsive."
              break
            fi
            echo "Waiting for services to become healthy (attempt $i/30)..."
            sleep 2
          done
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:3000/ready
          curl --fail http://localhost:3001/health
          curl --fail http://localhost:3001/ready

      - name: Execute Containerized MCP Streamable HTTP Smoke Test
        run: npx tsx scripts/docker-mcp-smoke.ts

      - name: Stop and Clean Docker Stack
        if: always()
        run: |
          docker compose logs
          docker compose down -v
